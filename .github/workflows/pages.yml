name: Website

on:
  push:
    branches: [main]
    paths: [website/**, scripts/install.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        # install.sh goes to the site root: curl -fsSL https://udsy19.github.io/super-paste/install.sh | bash
        run: |
          mkdir -p _site
          if [ -d website ]; then cp -R website/. _site/; fi
          cp scripts/install.sh _site/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
